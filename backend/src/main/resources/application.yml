server:
  port: 8080

spring:
  application:
    name: schemagenie-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/schemagenie}
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 86400000

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:3000}

groq:
  api-key: ${GROQ_API_KEY}
  model: openai/gpt-oss-120b
  base-url: https://api.groq.com/openai/v1

logging:
  level:
    com.schemagenie: INFO
