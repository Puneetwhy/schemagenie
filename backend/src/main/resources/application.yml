server:
  port: 8080

spring:
  application:
    name: schemagenie-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/schemagenie}
      auto-index-creation: true

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
  expiration-ms: 86400000

allowed:
  origins: ${ALLOWED_ORIGINS:http://localhost:3000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.0-flash
  base-url: https://generativelanguage.googleapis.com/v1beta/models

logging:
  level:
    com.schemagenie: INFO
